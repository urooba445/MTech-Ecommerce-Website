<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact | LuxeCart</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head>
<body data-page="contact"><header id="site-header"></header><main class="wrap page-main"><div class="page-intro"><p class="eyebrow">WE’RE HERE TO HELP</p><h1>Get in touch</h1><p>Have a question about our sample store? Send us a message.</p></div><div class="contact-layout"><section class="contact-info"><h2>Contact details</h2><p><strong>Email</strong><br>hello@luxecart.example</p><p><strong>Hours</strong><br>Monday–Saturday, 10 AM–6 PM</p><p class="muted">Demo contact information for this student project.</p></section><form id="contact-form" class="form-card"><label for="contact-name">Your name</label><input id="contact-name" name="name" required minlength="2" placeholder="Enter your name"><label for="contact-email">Email address</label><input id="contact-email" name="email" type="email" required placeholder="you@example.com"><label for="contact-subject">Subject</label><input id="contact-subject" name="subject" required placeholder="How can we help?"><label for="contact-message">Message</label><textarea id="contact-message" name="message" required minlength="10" rows="5" placeholder="Write your message..."></textarea><button class="btn" type="submit">Send message</button><p id="contact-feedback" class="form-feedback" role="status"></p><p class="tiny muted">Frontend demo only. This form does not send email.</p></form></div></main><footer id="site-footer"></footer></body></html>
