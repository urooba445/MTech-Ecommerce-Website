<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shop | LuxeCart</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script></head>
<body data-page="shop"><header id="site-header"></header><main class="wrap page-main"><div class="page-intro"><p class="eyebrow">THE LUXECART COLLECTION</p><h1>Shop all products</h1><p>Find something you’ll love, made for everyday life.</p></div><div class="shop-tools"><input id="search-input" type="search" placeholder="Search products..." aria-label="Search products"><select id="category-filter" aria-label="Filter by category"><option value="All">All categories</option><option>Bags</option><option>Shoes</option><option>Clothing</option><option>Accessories</option></select><select id="sort-filter" aria-label="Sort products"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name: A to Z</option></select></div><p id="product-count" class="muted"></p><div id="shop-products" class="product-grid"></div><div id="shop-empty" class="empty-state hidden"><h2>No products found</h2><p>Try another search or category.</p></div></main><footer id="site-footer"></footer></body></html>
